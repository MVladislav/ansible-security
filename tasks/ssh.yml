---
# tasks file for ./roles/security

# ------------------------------------------------------------------------------
- name: "SSH | global | apt | install dependencies"
  become: true
  ansible.builtin.apt:
    name: "{{ security_ssh_package_dependencies }}"
    state: present
    force_apt_get: true # apt-get instead of aptitude
    update_cache: true
    cache_valid_time: 3600
  when:
    - security_ssh_package_dependencies | length > 0
  tags:
    - security
    - ssh

# ------------------------------------------------------------------------------
- name: "SSH | global | file | ensure privilege separation directory"
  become: true
  ansible.builtin.file:
    path: "{{ security_ssh_privilege_separation_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - security
    - ssh

# ------------------------------------------------------------------------------
- name: "SSH | global | command | check short DH moduli"
  become: true
  ansible.builtin.command:
    argv:
      - awk
      - -v
      - "min={{ security_ssh_short_moduli }}"
      - "$5 < min { found=1 } END { exit(found ? 0 : 1) }"
      - "{{ security_ssh_directory }}/moduli"
  register: security_ssh_short_moduli_check
  changed_when: false
  failed_when: security_ssh_short_moduli_check.rc not in [0, 1]
  tags:
    - security
    - ssh

- name: "SSH | global | command | remove short DH moduli"
  become: true
  ansible.builtin.shell: |
    set -euo pipefail

    moduli="{{ security_ssh_directory }}/moduli"
    tmp="$(mktemp "${moduli}.XXXXXX")"

    trap 'rm -f "$tmp"' EXIT

    awk -v min="{{ security_ssh_short_moduli }}" '$5 >= min' "$moduli" > "$tmp"

    chown --reference="$moduli" "$tmp"
    chmod --reference="$moduli" "$tmp"

    mv "$tmp" "$moduli"
    trap - EXIT
  args:
    executable: /bin/bash
  changed_when: true
  notify: Restart and enable ssh
  when:
    - security_ssh_short_moduli_check is defined
    - security_ssh_short_moduli_check.rc == 0
  tags:
    - security
    - ssh

# ------------------------------------------------------------------------------
- name: "SSH | global | command | recreate ssh_host_* files - find existing"
  become: true
  ansible.builtin.find:
    paths: "{{ security_ssh_host_keys_func_rm.path }}"
    patterns: "{{ security_ssh_host_keys_func_rm.name }}"
    use_regex: true
    file_type: file
  register: security_ssh_host_files_to_delete
  when:
    - security_ssh_recreate_host_keys | bool
    - security_ssh_host_keys_func_rm is defined
    - security_ssh_host_keys_func_rm.path is defined
    - security_ssh_host_keys_func_rm.name is defined
  tags:
    - security
    - ssh

- name: "SSH | global | command | recreate ssh_host_* files - remove existing"
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ security_ssh_host_files_to_delete.files | default([]) }}"
  notify: Restart and enable ssh
  when:
    - security_ssh_recreate_host_keys | bool
    - security_ssh_host_files_to_delete is defined
    - security_ssh_host_files_to_delete.files is defined
    - item.path is defined
  tags:
    - molecule-idempotence-notest
    - security
    - ssh

- name: "SSH | global | command | recreate ssh_host_* files - generate selected"
  become: true
  ansible.builtin.command:
    argv: "{{ ['ssh-keygen', '-t', item.type] + (['-b', item.bits | string] if item.bits is defined else []) + ['-f', item.path, '-N', ''] }}"
  changed_when: true
  notify: Restart and enable ssh
  loop: "{{ security_ssh_host_keys_func_gen }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - security_ssh_recreate_host_keys | bool
    - security_ssh_host_files_to_delete is defined
    - security_ssh_host_files_to_delete.files is defined
  tags:
    - molecule-idempotence-notest
    - security
    - ssh

# ------------------------------------------------------------------------------
- name: "SSH | global | template | configure sshd"
  become: true
  ansible.builtin.template:
    src: ssh/sshd_config.config.j2
    dest: "{{ security_ssh_directory }}/sshd_config"
    backup: true
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart and enable ssh
  tags:
    - security
    - ssh
