---
# tasks file for ./roles/security

# ------------------------------------------------------------------------------
- name: "SSH | user | ensures ~/.ssh/config dir exists"
  become: true
  become_user: "{{ security_ssh_client }}"
  ansible.builtin.file:
    path: "~/.ssh"
    state: directory
    owner: "{{ security_ssh_client }}"
    group: "{{ security_ssh_client }}"
    mode: "0700"
  tags:
    - security
    - ssh
    - ssh-user

- name: "SSH | user | copy ssh config template for user"
  become: true
  become_user: "{{ security_ssh_client }}"
  ansible.builtin.template:
    src: ssh/config.config.j2
    dest: "~/.ssh/config"
    owner: "{{ security_ssh_client }}"
    group: "{{ security_ssh_client }}"
    mode: "0600"
  tags:
    - security
    - ssh
    - ssh-user
