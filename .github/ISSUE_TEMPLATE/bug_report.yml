---
name: Report a bug
description: Report a problem with the ansible-security role.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

        For feature requests and general questions, please use
        [Discussions](https://github.com/MVladislav/ansible-security/discussions)
        instead.
  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: Describe the problem
      description: >
        A clear and concise description of what the problem is. What were you
        trying to do, and what happened instead?
  - type: textarea
    id: expected
    validations:
      required: true
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: reproduction
    validations:
      required: true
    attributes:
      label: Steps to reproduce
      description: >
        Describe how to reproduce the issue: the playbook and variables used,
        the `security_setup_services` combination, and the exact error output.
      render: text
  - type: textarea
    id: environment
    validations:
      required: true
    attributes:
      label: Environment
      description: >
        Role version (commit or tag), Ansible version (`ansible --version`),
        and the Ubuntu version of the target host.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Paste any relevant log output or error messages. Please redact
        sensitive information such as SNMP credentials.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Any other context or screenshots that might help.
